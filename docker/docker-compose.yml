services:
  d4cute-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: d4cute-dev
    container_name: d4cute-dev
    ports:
      - "4321:4321"
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - PUBLIC_GISCUS_REPO_ID=${PUBLIC_GISCUS_REPO_ID:-PLACEHOLDER}
      - PUBLIC_GISCUS_CATEGORY=${PUBLIC_GISCUS_CATEGORY:-Comments}
      - PUBLIC_GISCUS_CATEGORY_ID=${PUBLIC_GISCUS_CATEGORY_ID:-PLACEHOLDER}
    command: npm run dev -- --host 0.0.0.0
